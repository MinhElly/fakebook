spring:
  cloud:
    function:
      definition: processPostEvent;kafkaConsumer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          brokers: localhost:9092
        bindings:
          processPostEvent-in-0:
            consumer:
              enable-dlq: true
              dlq-name: post-events-dlt
              auto-commit-offset: false
      bindings:
        processPostEvent-in-0:
          destination: post-events
          content-type: text/plain
          group: comment-service-post-sync
          consumer:
            max-attempts: 3
        binding-out-0:
          destination: post-events
          content-type: text/plain
          group: comment-service
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: comment-service
