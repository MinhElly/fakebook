name: Fakebook CI/CD Pipeline

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Frontend Build & Verification
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  # 2. Backend Microservices Matrix Build & Push to GHCR
  build-backend-services:
    name: Build & Push Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            path: gateway
            image_name: fakebook-gateway
          - service: authService
            path: authService
            image_name: fakebook-authservice
          - service: userService
            path: userService
            image_name: fakebook-userservice
          - service: postService
            path: postService
            image_name: fakebook-postservice
          - service: mediaService
            path: mediaService
            image_name: fakebook-mediaservice
          - service: commentService
            path: commentService
            image_name: fakebook-commentservice
          - service: feedService
            path: feedService
            image_name: fakebook-feedservice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        run: |
          echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build & Push OCI Image via Maven Jib
        run: |
          cd ${{ matrix.path }}
          chmod +x mvnw
          
          IMAGE_TAG="${IMAGE_PREFIX}/${{ matrix.image_name }}"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR detected: Running compile dry-run..."
            ./mvnw clean compile -DskipTests
          else
            BRANCH_REF="${{ github.ref_name }}"
            EXTRA_TAGS="${BRANCH_REF}"
            if [ "${BRANCH_REF}" = "main" ] || [ "${BRANCH_REF}" = "master" ]; then
              EXTRA_TAGS="latest,main"
            fi

            echo "Push detected: Building and pushing images: ${IMAGE_TAG}:${SHORT_SHA}, ${IMAGE_TAG}:${EXTRA_TAGS}"
            ./mvnw clean package jib:build -DskipTests \
              -Djib.to.image="${IMAGE_TAG}:${SHORT_SHA}" \
              -Djib.to.tags="${EXTRA_TAGS}" \
              -Djib.to.auth.username="${{ github.actor }}" \
              -Djib.to.auth.password="${{ secrets.GITHUB_TOKEN }}"
          fi

  # 3. Pipeline Completion Summary
  pipeline-summary:
    name: CI/CD Pipeline Summary
    needs: [build-frontend, build-backend-services]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.build-frontend.result }}" = "success" ] && [ "${{ needs.build-backend-services.result }}" = "success" ]; then
            echo "🎉 CI/CD Pipeline Completed Successfully!"
          else
            echo "❌ CI/CD Pipeline Failed!"
            exit 1
          fi
