name: Fakebook CI/CD Pipeline

on:
  push:
    branches: [develop, staging, main, master]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [develop, staging, main, master]
  workflow_dispatch:
    inputs:
      promote_to_staging:
        description: 'Promote release to staging'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify source versus manifest changes
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            python scripts/gitops/release.py changes --base "$BASE" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  validate-config:
    name: Validate Configuration & Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject stale or expanded local release PRs
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/gitops-local-release' && github.base_ref == 'develop'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/gitops/release.py verify-local --base "$BASE_SHA" --head "$HEAD_SHA" \
            --owner "${GITHUB_REPOSITORY_OWNER,,}"
      - name: Validate Compose templates
        run: |
          docker compose -f infrastructure/docker-compose.yml config --quiet
          docker compose --env-file infrastructure/.env.staging.example -f infrastructure/docker-compose-staging.yml config --quiet
      - name: Validate Kustomize overlay
        run: |
          kubectl kustomize infrastructure/k8s/overlays/local > /tmp/fakebook-local.yaml
          kubectl kustomize infrastructure/k8s/overlays/staging > /tmp/fakebook-staging.yaml
      - name: Test release promotion safeguards
        run: python -m unittest discover -s scripts/gitops -p 'test_*.py' -v

  build-frontend:
    name: Verify / Publish (frontend)
    needs: [changes, validate-config]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build
      - name: Prepare image name
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified frontend bundle
        id: publish
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fakebook-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record frontend digest
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python scripts/gitops/release.py record --name fakebook-frontend --sha "$GITHUB_SHA" \
            --owner "${GITHUB_REPOSITORY_OWNER,,}" --digest "$DIGEST" --output release/fakebook-frontend.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        with:
          name: release-fakebook-frontend
          path: release/fakebook-frontend.json
          if-no-files-found: error

  build-backend-services:
    name: Verify / Publish (${{ matrix.service }})
    needs: [changes, validate-config]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            path: gateway
            image_name: fakebook-gateway
          - service: userService
            path: userService
            image_name: fakebook-userservice
          - service: postService
            path: postService
            image_name: fakebook-postservice
          - service: mediaService
            path: mediaService
            image_name: fakebook-mediaservice
          - service: commentService
            path: commentService
            image_name: fakebook-commentservice
          - service: feedService
            path: feedService
            image_name: fakebook-feedservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify backend service
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x mvnw
          ./mvnw -ntp clean verify
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified backend classes
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        working-directory: ${{ matrix.path }}
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # jib:build uses the classes produced by clean verify; do not repackage.
          ./mvnw -ntp jib:build \
            -Djib.to.image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            -Djib.to.auth.username="$GITHUB_ACTOR" \
            -Djib.to.auth.password="$REGISTRY_TOKEN"
      - name: Record backend digest
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          MODULE_PATH: ${{ matrix.path }}
        run: |
          python scripts/gitops/release.py record --name "$IMAGE_NAME" --sha "$GITHUB_SHA" \
            --owner "${GITHUB_REPOSITORY_OWNER,,}" --digest "$(cat "$MODULE_PATH/target/jib-image.digest")" \
            --output "release/$IMAGE_NAME.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)
        with:
          name: release-${{ matrix.image_name }}
          path: release/${{ matrix.image_name }}.json
          if-no-files-found: error

  promote-local:
    name: Open local GitOps release PR
    needs: [changes, validate-config, build-frontend, build-backend-services]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check GitHub App configuration
        env:
          APP_ID: ${{ vars.GITOPS_APP_ID }}
          APP_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo '::error::Configure GITOPS_APP_ID and GITOPS_APP_PRIVATE_KEY for a repository-installed App with Contents and Pull requests write permissions.'
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Reject superseded source releases
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Only manifest/doc commits may have landed since this source build.
          CHANGES=$(python scripts/gitops/release.py changes --base "$SOURCE_SHA" --head HEAD)
          if [ "$CHANGES" != 'build=false' ]; then
            echo '::error::New source changes landed during this build. Wait for the newer CI release.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the seven verified publication digests
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/gitops/release.py promote --sha "$SOURCE_SHA" --owner "${GITHUB_REPOSITORY_OWNER,,}" \
            --artifacts release --overlay infrastructure/k8s/overlays/local/kustomization.yaml \
            --verify-registry --body /tmp/release-body.md --run-url "$RUN_URL"
          kubectl kustomize infrastructure/k8s/overlays/local > /tmp/fakebook-release.yaml
      - name: Create or update release PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: codex/gitops-local-release
          base: develop
          add-paths: infrastructure/k8s/overlays/local/kustomization.yaml
          commit-message: 'chore(gitops): promote local images from ${{ github.sha }}'
          title: 'chore(gitops): release local from ${{ github.sha }}'
          body-path: /tmp/release-body.md
      - name: Enable protected auto-merge for local release
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          # Fail closed: --auto must wait for required checks on an up-to-date PR.
          gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                autoMergeAllowed squashMergeAllowed
                ref(qualifiedName: "refs/heads/develop") {
                  branchProtectionRule {
                    requiresStatusChecks requiresStrictStatusChecks requiredStatusCheckContexts
                  }
                }
              }
            }' > /tmp/local-auto-merge-policy.json
          python - <<'PY'
          import json
          repo = json.load(open('/tmp/local-auto-merge-policy.json'))['data']['repository']
          rule = (repo.get('ref') or {}).get('branchProtectionRule') or {}
          if not (repo['autoMergeAllowed'] and repo['squashMergeAllowed']
                  and rule.get('requiresStatusChecks') and rule.get('requiresStrictStatusChecks')
                  and 'CI/CD Pipeline Summary' in rule.get('requiredStatusCheckContexts', [])):
              raise SystemExit('Enable repository auto-merge/squash and protect develop with '
                               'required CI/CD Pipeline Summary + up-to-date branches. '
                               'No protections are bypassed; release PR remains open.')
          PY
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$PR_HEAD"
      - name: Record release PR
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: echo "GitOps release PR - $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  promote-staging:
    name: Open staging GitOps release PR
    needs: [changes, validate-config, build-frontend, build-backend-services]
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release:staging')) || (github.event_name == 'workflow_dispatch' && inputs.promote_to_staging == true)) && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check GitHub App configuration
        env:
          APP_ID: ${{ vars.GITOPS_APP_ID }}
          APP_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo '::error::Configure GITOPS_APP_ID and GITOPS_APP_PRIVATE_KEY for a repository-installed App with Contents and Pull requests write permissions.'
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the seven verified publication digests to staging
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/gitops/release.py promote --sha "$SOURCE_SHA" --owner "${GITHUB_REPOSITORY_OWNER,,}" \
            --artifacts release --overlay infrastructure/k8s/overlays/staging/kustomization.yaml \
            --verify-registry --body /tmp/release-staging-body.md --run-url "$RUN_URL"
          kubectl kustomize infrastructure/k8s/overlays/staging > /tmp/fakebook-staging-release.yaml
      - name: Create or update staging release PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: codex/gitops-staging-release
          base: staging
          add-paths: infrastructure/k8s/overlays/staging/kustomization.yaml
          commit-message: 'chore(gitops): promote staging images from ${{ github.sha }}'
          title: 'chore(gitops): release staging from ${{ github.sha }}'
          body-path: /tmp/release-staging-body.md
      - name: Record staging release PR
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: echo "GitOps Staging release PR - $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  pipeline-summary:
    name: CI/CD Pipeline Summary
    needs: [changes, validate-config, build-frontend, build-backend-services, promote-local, promote-staging]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required stages
        env:
          RESULTS: ${{ toJSON(needs) }}
          PROMOTE_STAGING: ${{ inputs.promote_to_staging || false }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          required = ['changes', 'validate-config']
          if jobs['changes']['outputs'].get('build') == 'true':
              required += ['build-frontend', 'build-backend-services']
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/develop' and jobs['changes']['outputs'].get('build') == 'true':
              required.append('promote-local')
          pr_labels = json.loads(os.environ.get('PR_LABELS') or '[]')
          is_pr_staging = os.environ['GITHUB_EVENT_NAME'] == 'pull_request' and 'release:staging' in pr_labels
          is_tag_staging = os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'].startswith('refs/tags/v')
          is_manual_staging = os.environ.get('PROMOTE_STAGING') == 'true'
          if (is_tag_staging or is_pr_staging or is_manual_staging) and jobs['changes']['outputs'].get('build') == 'true':
              required.append('promote-staging')
          failed = [name for name in required if jobs[name]['result'] != 'success']
          if failed:
              raise SystemExit('Required stages failed: ' + ', '.join(failed))
          print('All required CI/release stages passed. Runtime acceptance remains separate.')
          PY
