---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fakebook-staging
    kind: SecretStore
  target:
    name: gateway-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fakebook/staging/gateway
