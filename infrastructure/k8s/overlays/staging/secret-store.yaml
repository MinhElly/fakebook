apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fakebook-staging
  namespace: fakebook-staging
spec:
  provider:
    vault:
      server: https://vault.staging.fakebook.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: fakebook-staging
          serviceAccountRef:
            name: external-secrets
