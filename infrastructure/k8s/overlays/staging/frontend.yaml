apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  app-config.json: |
    {
      "environment": "staging",
      "apiBaseUrl": "https://api.staging.example.invalid",
      "keycloakBaseUrl": "https://auth.staging.example.invalid"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: fakebook-frontend
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /config/app-config.json
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config/app-config.json
              subPath: app-config.json
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
