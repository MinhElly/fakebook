apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fakebook-staging
resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - frontend.yaml
  - ingress.yaml
  - secret-store.yaml
  - external-secrets.yaml
patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: r2dbc:mariadb://db.staging.fakebook.com:3306/gateway?sslMode=VERIFY_FULL
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: jdbc:mariadb://db.staging.fakebook.com:3306/gateway?sslMode=verify-full
  - target:
      kind: Deployment
      name: userservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: jdbc:mariadb://db.staging.fakebook.com:3306/user_service?sslMode=verify-full
  - target:
      kind: Deployment
      name: postservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: jdbc:mariadb://db.staging.fakebook.com:3306/post_service?sslMode=verify-full
  - target:
      kind: Deployment
      name: mediaservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: jdbc:mariadb://db.staging.fakebook.com:3306/media_service?sslMode=verify-full
  - target:
      kind: Deployment
      name: commentservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: jdbc:mariadb://db.staging.fakebook.com:3306/comment_service?sslMode=verify-full
  - target:
      kind: Deployment
      name: feedservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: jdbc:mariadb://db.staging.fakebook.com:3306/feed_service?sslMode=verify-full
  - target:
      kind: Service
      name: gateway|userservice|postservice|mediaservice|commentservice|feedservice
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: unused
        labels:
          fakebook-metrics: backend

images:
  - name: fakebook-gateway
    newName: ghcr.io/minhelly/fakebook-gateway
    newTag: sha-0081773841d508408c3ff16ad7cad208e668abf8
