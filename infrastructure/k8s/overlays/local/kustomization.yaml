apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fakebook-local

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml
  - frontend.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          spec:
            hostAliases:
              - ip: "192.168.65.254"
                hostnames:
                  - auth.fakebook.test
  - target:
      kind: Deployment
      name: userservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: userservice
        annotations:
          argocd.argoproj.io/sync-wave: "0"
  - target:
      kind: Deployment
      name: mediaservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mediaservice
        annotations:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      kind: Deployment
      name: postservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postservice
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      kind: Deployment
      name: commentservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: commentservice
        annotations:
          argocd.argoproj.io/sync-wave: "3"
  - target:
      kind: Deployment
      name: feedservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: feedservice
        annotations:
          argocd.argoproj.io/sync-wave: "4"
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
        annotations:
          argocd.argoproj.io/sync-wave: "5"
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        annotations:
          argocd.argoproj.io/sync-wave: "6"

images:
  - name: fakebook-gateway
    newName: ghcr.io/minhelly/fakebook-gateway
    newTag: sha-cd22d4a04839bc636dbe476e8ffe01b13c6ffbb6
    digest: sha256:6c396850e79009394aef5e93871c06249ba2750e8f1a94c9000d6ebb9f0212bd
  - name: fakebook-userservice
