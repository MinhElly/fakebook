apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: fakebook-gateway
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: fakebook-config
            - secretRef:
                name: gateway-secrets

          env:
            - name: SPRING_R2DBC_URL
              value: "r2dbc:mariadb://host.docker.internal:3307/gateway?sslMode=DISABLED"
            - name: SPRING_LIQUIBASE_URL
              value: "jdbc:mariadb://host.docker.internal:3307/gateway?sslMode=disable"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /management/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    gitops-check: "auto-sync-v1"
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP