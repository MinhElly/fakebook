apiVersion: apps/v1
kind: Deployment
metadata:
  name: commentservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commentservice
  template:
    metadata:
      labels:
        app: commentservice
    spec:
      automountServiceAccountToken: false
      containers:
        - name: commentservice
          image: fakebook-commentservice
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8085

          envFrom:
            - configMapRef:
                name: fakebook-config
            - secretRef:
                name: commentservice-secrets

          env:
            - name: FAKEBOOK_OIDC_INTERNAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: commentservice-secrets
                  key: FAKEBOOK_OIDC_CLIENT_ID
            - name: FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: commentservice-secrets
                  key: FAKEBOOK_OIDC_CLIENT_SECRET
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mariadb://host.docker.internal:3307/comment_service?sslMode=disable"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /management/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: commentservice
spec:
  selector:
    app: commentservice
  ports:
    - name: http
      port: 8085
      targetPort: http
  type: ClusterIP
