services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: fakebook-keycloak

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_GOOGLE_CLIENT_ID: ${KEYCLOAK_GOOGLE_CLIENT_ID:-}
      KEYCLOAK_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:-}

    ports:
      - "${KEYCLOAK_HTTP_PORT}:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../../gateway/src/main/docker/realm-config:/opt/keycloak/data/import:ro

    restart: unless-stopped

volumes:
  keycloak_data: