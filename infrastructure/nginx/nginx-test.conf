events {
    worker_connections 2048;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format perf '$remote_addr - $request_method $request_uri $status '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log perf;

    server {
        listen 80;
        server_name test.127.0.0.1.nip.io localhost;

        client_max_body_size 100m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;

        location = /healthz {
            access_log off;
            return 200 'UP\n';
            add_header Content-Type text/plain;
        }

        location /realms/ {
            set $keycloak_upstream fakebook-keycloak:9080;
            proxy_pass http://$keycloak_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /resources/ {
            set $keycloak_upstream fakebook-keycloak:9080;
            proxy_pass http://$keycloak_upstream;
        }

        location /services/ {
            set $gateway_upstream fakebook-gateway:8080;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
        }

        location /api/ {
            set $gateway_upstream fakebook-gateway:8080;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
        }

        location / {
            return 404;
        }
    }
}
