events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip nén dữ liệu cho trang web chạy nhanh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # DNS Resolver nội bộ trong Docker Network
    resolver 127.0.0.11 valid=30s;

    # =========================================================================
    # 1. HTTP Server Block: Tự động Redirect HTTP sang HTTPS & Thử nghiệm Certbot
    # =========================================================================
    server {
        listen 80;
        server_name staging.fakebook.com *.nip.io localhost;

        # Chỗ cho Certbot kiểm tra xác thực tên miền khi cấp SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect toàn bộ truy cập HTTP thường sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. HTTPS Server Block: Reverse Proxy cho Single Domain
    # =========================================================================
    server {
        listen 443 ssl;
        server_name staging.fakebook.com *.nip.io localhost;

        # Cấu hình đường dẫn chứng chỉ SSL Let's Encrypt Certbot trên VPS
        ssl_certificate     /etc/letsencrypt/live/staging.fakebook.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.fakebook.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Giới hạn kích thước upload (Ảnh/Video Media)
        client_max_body_size 50M;

        # Các Proxy Headers bắt buộc để Keycloak & Spring Boot Gateway nhận diện SSL
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # ---------------------------------------------------------------------
        # ROUTE 1: Chuyển hướng tới Keycloak IAM (/realms, /resources, /admin)
        # ---------------------------------------------------------------------
        location /realms/ {
            proxy_pass http://fakebook-keycloak:9080/realms/;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /resources/ {
            proxy_pass http://fakebook-keycloak:9080/resources/;
        }

        location /admin/ {
            proxy_pass http://fakebook-keycloak:9080/admin/;
        }

        # ---------------------------------------------------------------------
        # ROUTE 2: Chuyển hướng tới Spring Cloud API Gateway (/api/...)
        # ---------------------------------------------------------------------
        location /services/ {
            proxy_pass http://fakebook-gateway:8080/services/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
        location /api/ {
            proxy_pass http://fakebook-gateway:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------------------------------------------------------------------
        # ROUTE 3: Single Page Application / Frontend Root (/)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://fakebook-frontend:80/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
