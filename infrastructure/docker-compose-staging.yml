name: fakebook-infrastructure-staging

services:
  mariadb:
    image: mariadb:12.3.3
    container_name: fakebook-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: gateway
      GATEWAY_DB_USERNAME: ${GATEWAY_DB_USERNAME:?GATEWAY_DB_USERNAME is required}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?GATEWAY_DB_PASSWORD is required}

      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}

      USER_DB_USERNAME: ${USER_DB_USERNAME:?USER_DB_USERNAME is required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}

      POST_DB_USERNAME: ${POST_DB_USERNAME:?POST_DB_USERNAME is required}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD:?POST_DB_PASSWORD is required}

      MEDIA_DB_USERNAME: ${MEDIA_DB_USERNAME:?MEDIA_DB_USERNAME is required}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?MEDIA_DB_PASSWORD is required}

      COMMENT_DB_USERNAME: ${COMMENT_DB_USERNAME:?COMMENT_DB_USERNAME is required}
      COMMENT_DB_PASSWORD: ${COMMENT_DB_PASSWORD:?COMMENT_DB_PASSWORD is required}

      FEED_DB_USERNAME: ${FEED_DB_USERNAME:?FEED_DB_USERNAME is required}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD:?FEED_DB_PASSWORD is required}

      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - /var/lib/fakebook-staging/mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    command: mariadbd --lower_case_table_names=1 --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-StagingAdminPass2026!}
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak?useUnicode=true&characterEncoding=utf8&useSSL=false
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_FEATURES: scripts
      KC_HTTP_PORT: 9080
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-https://staging.fakebook.com}
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
      KC_HEALTH_ENABLED: 'true'
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../gateway/src/main/docker/realm-config:/opt/keycloak/data/import:ro
      - ../gateway/src/main/docker/realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  keycloak-internal-client-config:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak-internal-client-config
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:9080
      KEYCLOAK_REALM: jhipster
      KEYCLOAK_SYNC_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KEYCLOAK_SYNC_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      FAKEBOOK_OIDC_INTERNAL_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
    volumes:
      - ./keycloak/configure-internal-client.sh:/opt/keycloak-config/configure-internal-client.sh:ro
    entrypoint:
      - /bin/sh
      - /opt/keycloak-config/configure-internal-client.sh
    restart: "no"

  consul:
    image: hashicorp/consul:2.0.3
    container_name: fakebook-consul
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    container_name: fakebook-consul-config-loader
    depends_on:
      consul:
        condition: service_healthy
    environment:
      INIT_SLEEP_SECONDS: 5
      CONSUL_URL: consul
      CONSUL_PORT: 8500
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./config/central-server-config:/config:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.3.1
    container_name: fakebook-kafka
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    container_name: fakebook-redis
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - /var/lib/fakebook-staging/redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: fakebook-zipkin
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  gateway:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-gateway:${IMAGE_TAG:-staging}
    container_name: fakebook-gateway
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${GATEWAY_DB_USERNAME:?GATEWAY_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?GATEWAY_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  authservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-authservice:${IMAGE_TAG:-staging}
    container_name: fakebook-authservice
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  userservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-userservice:${IMAGE_TAG:-staging}
    container_name: fakebook-userservice
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${USER_DB_USERNAME:?USER_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  postservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-postservice:${IMAGE_TAG:-staging}
    container_name: fakebook-postservice
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${POST_DB_USERNAME:?POST_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${POST_DB_PASSWORD:?POST_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  mediaservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-mediaservice:${IMAGE_TAG:-staging}
    container_name: fakebook-mediaservice
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${MEDIA_DB_USERNAME:?MEDIA_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?MEDIA_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  commentservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-commentservice:${IMAGE_TAG:-staging}
    container_name: fakebook-commentservice
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${COMMENT_DB_USERNAME:?COMMENT_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${COMMENT_DB_PASSWORD:?COMMENT_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  feedservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-feedservice:${IMAGE_TAG:-staging}
    container_name: fakebook-feedservice
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FAKEBOOK_DB_USERNAME: ${FEED_DB_USERNAME:?FEED_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${FEED_DB_PASSWORD:?FEED_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-frontend:${IMAGE_TAG:-staging}
    container_name: fakebook-frontend
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped    

  nginx:
    image: nginx:1.27-alpine
    container_name: fakebook-nginx
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt/live/staging.fakebook.com:ro
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  keycloak-data:
