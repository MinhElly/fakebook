name: fakebook-infrastructure-staging

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_DB: mariadb
      KC_DB_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/keycloak?useUnicode=true&characterEncoding=utf8&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_DB_POOL_INITIAL_SIZE: ${KEYCLOAK_DB_POOL_INITIAL_SIZE:-1}
      KC_DB_POOL_MIN_SIZE: ${KEYCLOAK_DB_POOL_MIN_SIZE:-1}
      KC_DB_POOL_MAX_SIZE: ${KEYCLOAK_DB_POOL_MAX_SIZE:-5}
      KC_FEATURES: scripts
      KC_HTTP_PORT: 9080
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_PORT: 9990
      KEYCLOAK_GOOGLE_CLIENT_ID: ${KEYCLOAK_GOOGLE_CLIENT_ID:?KEYCLOAK_GOOGLE_CLIENT_ID is required}
      KEYCLOAK_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:?KEYCLOAK_GOOGLE_CLIENT_SECRET is required}
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../gateway/src/main/docker/realm-config:/opt/keycloak/data/import:ro
      - ../gateway/src/main/docker/realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    healthcheck:
      test: bash /opt/keycloak/health-check.sh
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 15s
    restart: "on-failure:5"

  keycloak-internal-client-config:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak-internal-client-config
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:9080
      KEYCLOAK_REALM: jhipster
      KEYCLOAK_SYNC_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KEYCLOAK_SYNC_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      FAKEBOOK_OIDC_INTERNAL_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
    volumes:
      - ./keycloak/configure-internal-client.sh:/opt/keycloak-config/configure-internal-client.sh:ro
    entrypoint:
      - /bin/sh
      - /opt/keycloak-config/configure-internal-client.sh
    restart: "no"

  keycloak-google-config:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak-google-config
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:9080
      KEYCLOAK_REALM: jhipster
      KEYCLOAK_SYNC_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KEYCLOAK_SYNC_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      KEYCLOAK_GOOGLE_CLIENT_ID: ${KEYCLOAK_GOOGLE_CLIENT_ID:?KEYCLOAK_GOOGLE_CLIENT_ID is required}
      KEYCLOAK_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:?KEYCLOAK_GOOGLE_CLIENT_SECRET is required}
    volumes:
      - ./keycloak/configure-google-idp.sh:/opt/keycloak/configure-google-idp.sh:ro
    entrypoint:
      - /bin/bash
      - /opt/keycloak/configure-google-idp.sh
    restart: "no"

  consul:
    image: hashicorp/consul:2.0.3
    container_name: fakebook-consul
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    container_name: fakebook-consul-config-loader
    depends_on:
      consul:
        condition: service_healthy
    environment:
      INIT_SLEEP_SECONDS: 5
      CONSUL_URL: consul
      CONSUL_PORT: 8500
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./config/central-server-config:/config:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.3.1
    container_name: fakebook-kafka
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    container_name: fakebook-redis
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - /var/lib/fakebook-staging/redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: fakebook-zipkin
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  gateway:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-gateway:${IMAGE_TAG:-staging}
    container_name: fakebook-gateway
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,staging"
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_R2DBC_URL: "r2dbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/gateway?useLegacyDatetimeCode=false&sslMode=VERIFY_FULL&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_R2DBC_POOL_INITIAL_SIZE: ${GATEWAY_DB_POOL_INITIAL_SIZE:-1}
      SPRING_R2DBC_POOL_MAX_SIZE: ${GATEWAY_DB_POOL_MAX_SIZE:-3}
      SPRING_LIQUIBASE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/gateway?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      FAKEBOOK_DB_USERNAME: ${GATEWAY_DB_USERNAME:?GATEWAY_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?GATEWAY_DB_PASSWORD is required}
      STAGING_FRONTEND_URL: ${STAGING_FRONTEND_URL:?STAGING_FRONTEND_URL is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: "on-failure:5"

  authservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-authservice:${IMAGE_TAG:-staging}
    container_name: fakebook-authservice
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,staging"
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/auth_service?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX_SIZE:-3}
      FAKEBOOK_DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: "on-failure:5"

  userservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-userservice:${IMAGE_TAG:-staging}
    container_name: fakebook-userservice
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,staging"
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/user_service?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX_SIZE:-3}
      FAKEBOOK_DB_USERNAME: ${USER_DB_USERNAME:?USER_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      redis:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: "on-failure:5"

  postservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-postservice:${IMAGE_TAG:-staging}
    container_name: fakebook-postservice
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
