      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/post_service?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX_SIZE:-3}
      FAKEBOOK_DB_USERNAME: ${POST_DB_USERNAME:?POST_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${POST_DB_PASSWORD:?POST_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      consul-config-loader:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: "on-failure:5"

  mediaservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-mediaservice:${IMAGE_TAG:-staging}
    container_name: fakebook-mediaservice
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,staging"
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/media_service?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX_SIZE:-3}
      FAKEBOOK_DB_USERNAME: ${MEDIA_DB_USERNAME:?MEDIA_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?MEDIA_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      consul-config-loader:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: "on-failure:5"

  commentservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-commentservice:${IMAGE_TAG:-staging}
    container_name: fakebook-commentservice
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,staging"
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/comment_service?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX_SIZE:-3}
      FAKEBOOK_DB_USERNAME: ${COMMENT_DB_USERNAME:?COMMENT_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${COMMENT_DB_PASSWORD:?COMMENT_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      consul-config-loader:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: "on-failure:5"

  feedservice:
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-feedservice:${IMAGE_TAG:-staging}
    container_name: fakebook-feedservice
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,staging"
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT}
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${MARIADB_HOST:?MARIADB_HOST is required}:${MARIADB_PORT}/feed_service?useLegacyDatetimeCode=false&sslMode=verify-full&serverSslCert=${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX_SIZE:-3}
      FAKEBOOK_DB_USERNAME: ${FEED_DB_USERNAME:?FEED_DB_USERNAME is required}
      FAKEBOOK_DB_PASSWORD: ${FEED_DB_PASSWORD:?FEED_DB_PASSWORD is required}
      FAKEBOOK_OIDC_ISSUER_URI: ${FAKEBOOK_OIDC_ISSUER_URI}
      FAKEBOOK_OIDC_CLIENT_ID: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_ID:?FAKEBOOK_OIDC_INTERNAL_CLIENT_ID is required}
      FAKEBOOK_OIDC_CLIENT_SECRET: ${FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET:?FAKEBOOK_OIDC_INTERNAL_CLIENT_SECRET is required}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ${MARIADB_SSL_CERT_HOST_PATH:?MARIADB_SSL_CERT_HOST_PATH is required}:${MARIADB_SSL_CERT_CONTAINER_PATH:-/run/secrets/rds-global-bundle.pem}:ro
    depends_on:
      redis:
        condition: service_healthy
      consul-config-loader:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-internal-client-config:
        condition: service_completed_successfully
    restart: "on-failure:5"

  frontend:
    profiles: ["vm-frontend"]
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY_PREFIX:-}fakebook-frontend:${IMAGE_TAG:-staging}
    container_name: fakebook-frontend
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped    

  nginx:
    image: nginx:1.27-alpine
    container_name: fakebook-nginx
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${NGINX_CONFIG_FILE:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  keycloak-data:
