name: fakebook-infrastructure-staging

services:
  mariadb:
    image: mariadb:12.3.3
    container_name: fakebook-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-StagingRootPass2026!}
      MARIADB_DATABASE: gateway
    ports:
      - "3307:3306"
    volumes:
      - /var/lib/fakebook-staging/mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    command: mariadbd --lower_case_table_names=1 --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_FEATURES: scripts
      KC_HTTP_PORT: 9080
      KC_HEALTH_ENABLED: 'true'
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/fakebook-staging/keycloak_data:/opt/keycloak/data
      - ../gateway/src/main/docker/realm-config:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9080/realms/jhipster || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consul:
    image: hashicorp/consul:2.0.3
    container_name: fakebook-consul
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    ports:
      - "8500:8500"
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    container_name: fakebook-consul-config-loader
    depends_on:
      consul:
        condition: service_healthy
    environment:
      INIT_SLEEP_SECONDS: 2
      CONSUL_URL: consul
      CONSUL_PORT: 8500
    volumes:
      - ./config/central-server-config:/config:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.3.1
    container_name: fakebook-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    container_name: fakebook-redis
    ports:
      - "6379:6379"
    volumes:
      - /var/lib/fakebook-staging/redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: fakebook-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
