# Shared infrastructure for local development.
# Application services run on the host and connect through the published ports.
name: fakebook-infrastructure

services:
  mariadb:
    image: mariadb:12.3.3
    container_name: fakebook-mariadb
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
    ports:
      - 127.0.0.1:3307:3306
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    command: mariadbd --lower_case_table_names=1 --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: fakebook-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_FEATURES: scripts
      KC_HTTP_PORT: 9080
      KC_HTTPS_PORT: 9443
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_PORT: 9990
    ports:
      - 127.0.0.1:9080:9080
      - 127.0.0.1:9443:9443
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../gateway/src/main/docker/realm-config:/opt/keycloak/data/import:ro
      - ../gateway/src/main/docker/realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh:ro
    healthcheck:
      test: bash /opt/keycloak/health-check.sh
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s
    restart: unless-stopped

  consul:
    image: hashicorp/consul:2.0.3
    container_name: fakebook-consul
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    ports:
      - 127.0.0.1:8300:8300
      - 127.0.0.1:8500:8500
      - 127.0.0.1:8600:8600
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    container_name: fakebook-consul-config-loader
    depends_on:
      consul:
        condition: service_healthy
    environment:
      INIT_SLEEP_SECONDS: 0
      CONSUL_URL: consul
      CONSUL_PORT: 8500
    volumes:
      - ./config/central-server-config:/config:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.3.1
    container_name: fakebook-kafka
    ports:
      - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fakebook-kafka-ui
    ports:
      - 127.0.0.1:8085:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    container_name: fakebook-redis
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: fakebook-zipkin
    ports:
      - 127.0.0.1:9411:9411
    restart: unless-stopped

volumes:
  mariadb-data:
  keycloak-data:
