logging:
  level:
    com.minh.fakebook.post: INFO

server:
  port: 8083

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mariadb://${MARIADB_HOST:mariadb}:${MARIADB_PORT:3306}/postservice?useLegacyDatetimeCode=false
    username: ${FAKEBOOK_DB_USERNAME:root}
    password: ${FAKEBOOK_DB_PASSWORD:}
  liquibase:
    contexts: prod
