# Shared non-secret configuration loaded into Consul KV.
# Environment-specific endpoints belong in application-dev.yml or a service file.
configserver:
  name: Fakebook Consul Configuration
  status: Connected to Consul Server

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  cloud:
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
